<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Story Instagram 2 · Prise de contact (1080 × 1920)</title>
<!-- Zones sûres : 250 px en haut et en bas restent libres pour l'interface d'Instagram.
     La zone sous la carte « WhatsApp » est prévue pour le sticker « Lien » d'Instagram
     (lien : https://wa.me/33782923889). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../brand/tokens.css">
<link rel="stylesheet" href="commun.css">
<style>
h1 { margin-top: 80px; font-size: 128px; line-height: .98; }
h1 span { color: var(--yellow); }
.lead { margin-top: 36px; font-size: 42px; line-height: 1.35; color: #DCE4FF; }
.ask { margin-top: 52px; background: var(--white); color: var(--ink); border-radius: 36px; padding: 40px 44px; box-shadow: 0 40px 80px -30px rgba(10,15,31,.55); }
.ask h2 { font-size: 46px; letter-spacing: -.02em; }
.ask ul { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 18px; }
.ask li { display: flex; align-items: center; gap: 20px; font-size: 34px; }
.ask li i { flex: none; width: 50px; height: 50px; border-radius: 14px; background: var(--blue-soft); color: var(--blue-700); display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.tel { margin-top: 48px; text-align: center; }
.tel small { display: block; font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #DCE4FF; }
.tel b { display: block; font-family: var(--font-display); font-size: 92px; letter-spacing: -.02em; margin-top: 8px; }
.sticker-hint { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: var(--yellow); }
.sticker-hint svg { width: 56px; height: 56px; }
</style>
</head>
<body>
<div class="canvas story bg-blue">
  <span class="plus" style="--s:170px; right:60px; top:340px"></span>
  <div class="inner">
    <div class="head">
      <img src="../../../brand/logo-stud-plus-blanc.svg" alt="Stud+">
      <span class="pill pill-yellow">Premier échange</span>
    </div>

    <h1>Parlons de<br><span>votre enfant.</span></h1>
    <p class="lead">Un message suffit. Je vous réponds vite, et on fait le point ensemble.</p>

    <div class="ask">
      <h2>Dites-moi simplement&nbsp;:</h2>
      <ul>
        <li><i>1</i>Sa classe et la matière</li>
        <li><i>2</i>Votre ville ou arrondissement</li>
        <li><i>3</i>Vos disponibilités</li>
      </ul>
    </div>

    <p class="tel"><small>WhatsApp ou appel</small><b>07&nbsp;82&nbsp;92&nbsp;38&nbsp;89</b></p>

    <p class="sticker-hint">Touchez le lien pour m’écrire
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
    </p>
  </div>
</div>
</body>
</html>
